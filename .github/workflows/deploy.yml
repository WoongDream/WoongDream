name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# 새 배포가 시작되면 진행 중이던 이전 배포는 취소
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 1-pass: 해시 파일명 정적 에셋 → 1년 immutable 캐시 (index.html·소스맵 제외)
      - name: Sync static assets to S3
        run: |
          aws s3 sync ./dist "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.map"

      # 2-pass: index.html → no-cache (새 배포 즉시 반영)
      - name: Upload index.html with no-cache
        run: |
          aws s3 cp ./dist/index.html "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
